name: build

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub release with this tag (e.g. v0.1.0). Leave empty to just build."
        required: false
        default: ""

# the release tag, when this run publishes one: a pushed v* tag, a release created on the
# website, or a manual run with release_tag filled in (with or without the v)
env:
  RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

jobs:
  mustardos:
    name: MustardOS packages (Brick / Brick Hammer, Brick Pro)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The README shows the source's version
        run: |
          # README's "Latest release" line and the version in the source move together
          v=$(make -s version)
          grep -qF "**Latest release:** [v$v](../../releases/tag/v$v)" README.md ||
            { echo "::error::README.md's Latest release line isn't v$v, the version in the source"; exit 1; }
      - name: Build
        run: |
          # generated files are committed; keep make from regenerating them
          touch src/font_data.h
          pip install ziglang==0.14.1
          # the scripts the device runs: launchers, the screen wake, the system report
          for s in dist/HI5/launch.sh dist/HI5/sysinfo.sh dist/mustardos/*.sh; do sh -n "$s"; done
          bash -n install.sh
          # a release is built as the tag's version (v0.3.0 -> 0.3.0), which the app compares
          # with the latest release's tag to offer updates; otherwise HI5_VERSION in src/engine.h
          # (a tag typed as V0.5.0, 0.5.0 or with spaces around it is taken as v0.5.0)
          if [ -n "$RELEASE_TAG" ]; then
            v=$(printf '%s' "$RELEASE_TAG" | tr -d '[:space:]'); v=${v#[vV]}
            echo "$v" | grep -Eqx '[0-9]+(\.[0-9]+)*' || { echo "::error::release tag $RELEASE_TAG isn't v<number>.<number>..."; exit 1; }
          else
            v=$(make -s version)
          fi
          echo "building version $v"
          make -j"$(nproc)" package VERSION="$v"
          # the binaries in "HI5/", with mux_launch.sh and the list glyph
          for d in brick brickpro; do
            z=build/HI5-mustardos-$d.muxapp
            ls -l $z
            file build/$d/hi5 | grep -q "ARM aarch64"
            unzip -l $z | grep -q "HI5/hi5$"
            unzip -l $z | grep -q "HI5/mux_launch.sh$"
            unzip -l $z | grep -q "HI5/wake_screen.sh$"
            unzip -l $z | grep -q "HI5/sysinfo.sh$"
            unzip -l $z | grep -q "HI5/glyph/hi5.svg$"
            unzip -l $z | grep -q "HI5/samples/README.txt$"
            # the self-updater needs these: the CA bundle for HTTPS, and VERSION and DEVICE for install.sh
            unzip -l $z | grep -q "HI5/cacert.pem"
            test "$(unzip -p $z "HI5/VERSION")" = "$v"
            test "$(unzip -p $z "HI5/DEVICE")" = $d
            unzip -p $z "HI5/hi5" | cmp -s - build/$d/hi5
            # MustardOS's Archive Manager refuses absolute and .. paths, and anything not a file or folder
            # (a bare "! cmd" can't fail a step under set -e, hence the ifs)
            if unzip -Z1 $z | grep -Eq '^/|(^|/)\.\.(/|$)|\\'; then echo "::error::$z has unsafe paths"; exit 1; fi
            if unzip -Zl $z | grep -Eq '^[bclps]'; then echo "::error::$z has links or devices"; exit 1; fi
          done
          # the two builds differ by the Brick Pro's sticks (and the package each updates from)
          if cmp -s build/brick/hi5 build/brickpro/hi5; then echo "::error::the two builds are the same"; exit 1; fi
          strings build/brick/hi5 | grep -qx "/HI5-mustardos-brick.muxapp"
          strings build/brickpro/hi5 | grep -qx "/HI5-mustardos-brickpro.muxapp"
          # the version the binaries were built as, which the updater compares with the release
          strings build/brick/hi5 | grep -qx "THIS IS V$v"
          strings build/brickpro/hi5 | grep -qx "THIS IS V$v"
      - uses: actions/upload-artifact@v4
        with:
          name: HI5-mustardos
          path: |
            build/HI5-mustardos-brick.muxapp
            build/HI5-mustardos-brickpro.muxapp

  test:
    name: Engine and UI tests (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the test harness
        run: |
          touch src/font_data.h
          make build/hi5_test build/hi5_synctest
          mkdir -p build/test
          build/hi5_test build/test dist/HI5/samples | tee build/test/results.txt
      - name: Check the results
        run: |
          r=build/test/results.txt
          grep -q "^bpm after tap: 139.5, samples: 5" $r
          grep -q "^chain: bar1=A(sub on) bar2=B(sub off) bar3=B(sub off) bar4=A(sub on)" $r
          grep -q "^sync: bpm=128.0 playing=1 peers=1 leader=1 phase err after 4 s = -\?0.000 steps" $r
          grep -q "^sync: new packet 48 bytes, bpm=140.0 following=1" $r
          grep -q "^sync timing: .*(want under 1 and 2: 1)" $r
          grep -q "^sync timing, a leader without echo: .*(want under 6: 1)" $r
          grep -q "^clock: 2 PPQN at 120 BPM -> 17 pulses in 4 s, mean gap 250.00 ms" $r
          grep -q "^clock: 24 PPQN at 120 BPM -> 193 pulses in 4 s, mean gap 20.83 ms" $r
          grep -q "^v0.0.1 save: loaded=1 bpm=99 fx0=REPEAT out_mode=0" $r
          grep -q "^v0.0.7 save: loaded=1 sync=2 kits used=0" $r
          grep -q "^update prompt: shown 1, A installs 1, B closes it 1, pattern untouched 1" $r
          # USB MIDI clock and the Brick Pro's sticks
          grep -q "^midi clock in: START plays 1 from the first step 1, 120 BPM -> .* (1), phase within .* (want under 0.1: 1), STOP stops 1" $r
          grep -q "^midi cc: .*CC7 not ours: 1$" $r
          # the MIDI chart's CC table is the one the app uses
          build/hi5_test --midi-chart > cc.md
          sed -n '/<!-- cc table -->/,/<!-- end cc table -->/p' docs/MIDI.md | sed '1d;$d' | diff cc.md -
          grep -q "^midi clock out: START 1, .*(want 192: 1), STOP 1" $r
          grep -q "^midi modes .*(want 1: 1)" $r
          # the Brick clock link (USB gadget follower, usbfs leader) and the tight clock
          grep -q "^midi clock in at 250 BPM: .*(want under 0.5: 1)" $r
          grep -q "^clock only: .*(want 1: 1)" $r
          grep -q "^link sync: .*(want 1: 1)" $r
          grep -q "^link usb: .*(want 1: 1)" $r
          grep -q "^perflog: .*(want 0, 1, 1: 1)" $r
          grep -q "^perflog jumps: .*(want 0 1 0 0 0: 1)" $r
          grep -q "^stick: .*(darker: 1), .*(open again: 1), .*(thinner: 1); fx: stick 1, R2 first 1, back 1, insert 1, off 1" $r
          grep -q "^random sounds: changed 1, in range 1, mix and patterns kept 1, kit let go 1" $r
          grep -q "^leds: driven 1, effects off 1, bright 1; rings point with the sticks 1, level bar 1, beat on the shoulders 1, the rest dark 1; given back (dark frame, effects on): 1" $r
      - name: Wi-Fi sync between two units over UDP
        run: |
          build/hi5_synctest LEAD 131 6 > build/test/lead.txt &
          sleep 0.3
          build/hi5_synctest FOLLOW 100 5 | tee build/test/follow.txt
          wait
          grep -q "bpm 131.0 playing 1 peers 1 leading 0 following 1" build/test/follow.txt
      - name: Self-update against a local fake GitHub
        run: make update-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output
          path: build/test/

  release:
    name: Publish release
    # runs for: a pushed v* tag, a release created on the website, or a manual run with a tag filled in
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || inputs.release_tag != ''
    needs: [mustardos, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: HI5-mustardos
      - name: Check the packages are the tag's version
        run: |
          # the mustardos job built them as the tag's version; a mismatch would make the app offer
          # this update forever. A manual run's tag may leave out the v, or be typed V0.5.0.
          v=$(printf '%s' "$RELEASE_TAG" | tr -d '[:space:]'); v=${v#[vV]}
          TAG=v$v
          # a release made on the website keeps its own tag; the packages go onto it
          if [ "$GITHUB_EVENT_NAME" = release ]; then TAG=$RELEASE_TAG; fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          for d in brick brickpro; do
            test "$(unzip -p HI5-mustardos-$d.muxapp "HI5/VERSION")" = "$v" ||
              { echo "::error::HI5-mustardos-$d.muxapp isn't version $v"; exit 1; }
          done
      - name: Create the GitHub release with the MustardOS packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="HI5-mustardos-brick.muxapp HI5-mustardos-brickpro.muxapp"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" $files \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "HI5 $TAG" \
              --notes-file .github/release-notes.md \
              --latest
          fi
